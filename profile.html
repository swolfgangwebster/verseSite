<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="cursor-glow" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/">Daily Verse</a>
    <nav>
      <a href="/versus.html">Verse Versus</a>
      <a href="/trivia.html">Trivia</a>
      <a href="/shop.html">Shop</a>
      <a href="/account.html" id="accountLink">Account</a>
      <a href="/admin.html">Admin</a>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle dark mode">Dark</button>
    </nav>
  </header>
  <main class="page-shell narrow">
    <section class="reflection-panel profile-card" id="publicProfile">
      <div class="section-heading">
        <p class="eyebrow">Profile</p>
        <h1 id="publicProfileName">Loading profile...</h1>
        <p id="publicProfileBio"></p>
      </div>
    </section>
    <section class="feed-section">
      <div class="section-heading">
        <h2>Public reflections</h2>
      </div>
      <div id="profilePosts" class="feed-list"></div>
      <div class="center-actions">
        <button class="button ghost" id="loadMoreProfilePosts" type="button" hidden>Load more</button>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
